<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#FDFCFC"/>
  
  <!-- Stylized geometric layers -->
  <rect x="106" y="106" width="300" height="300" rx="12" stroke="#E4E4E7" stroke-width="2" />
  <rect x="128" y="128" width="256" height="256" rx="8" stroke="#F1F1F4" stroke-width="1" />
  
  <!-- Central Isometric Cube/Hexagon -->
  <g transform="translate(256, 256)">
    <!-- Outer Hex -->
    <path d="M0 -120 L104 -60 L104 60 L0 120 L-104 60 L-104 -60 Z" fill="none" stroke="url(#glow-light)" stroke-width="4" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite" />
    </path>
    
    <!-- Inner Hex -->
    <path d="M0 -80 L69 -40 L69 40 L0 80 L-69 40 L-69 -40 Z" fill="none" stroke="url(#glow-light)" stroke-width="2" opacity="0.4" />
    
    <!-- Central Cube lines -->
    <path d="M0 0 L0 -80 M0 0 L69 40 M0 0 L-69 40" stroke="url(#glow-light)" stroke-width="2" opacity="0.3" />
    
    <!-- Neural Network Nodes -->
    <circle cx="0" cy="-80" r="3" fill="#2563EB" />
    <circle cx="69" cy="40" r="3" fill="#7C3AED" />
    <circle cx="-69" cy="40" r="3" fill="#2563EB" />
    <circle cx="0" cy="0" r="4" fill="#18181B" />
  </g>
</svg>
