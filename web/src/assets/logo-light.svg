<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Terminal neon gradient -->
    <linearGradient id="terminalNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="50%" stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#6B46C1"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal icon -->
  <rect x="8" y="12" width="36" height="36" rx="6"
        fill="#F8FAFC" stroke="url(#terminalNeon)" stroke-width="1.5"/>

  <!-- Prompt -->
  <text x="16" y="34"
        font-family="JetBrains Mono, Fira Code, monospace"
        font-size="14"
        font-weight="500"
        fill="url(#terminalNeon)"
        filter="url(#subtleGlow)">
    &gt;_
  </text>

  <!-- Brand -->
  <text x="52" y="38"
        font-family="JetBrains Mono, Fira Code, system-ui, sans-serif"
        font-size="20"
        font-weight="600"
        fill="#1F2937">
    neocode
  </text>
</svg>
