<svg width="720" height="220" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Terminal neon gradient -->
    <linearGradient id="terminalNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="50%" stop-color="#0099CC"/>
      <stop offset="100%" stop-color="#6B46C1"/>
    </linearGradient>

    <!-- Neon glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle scanline -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="rgba(0,0,0,0.02)"/>
    </pattern>

    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="220" fill="url(#bgGradient)"/>

  <!-- Terminal window -->
  <rect x="16" y="26" width="188" height="168" rx="20"
        fill="#FFFFFF" stroke="url(#terminalNeon)" stroke-width="2"/>

  <!-- Scanline overlay -->
  <rect x="16" y="26" width="188" height="168" rx="20"
        fill="url(#scanlines)"/>

  <!-- Terminal header dots -->
  <circle cx="32" cy="46" r="4" fill="#FF5F57"/>
  <circle cx="46" cy="46" r="4" fill="#FFBD2E"/>
  <circle cx="60" cy="46" r="4" fill="#28CA42"/>

  <!-- Prompt -->
  <text x="48" y="108"
        font-family="JetBrains Mono, Fira Code, monospace"
        font-size="36"
        fill="url(#terminalNeon)"
        filter="url(#neonGlow)">
    &gt;_
  </text>

  <!-- Blinking cursor (static frame) -->
  <rect x="102" y="84" width="6" height="36" fill="#00A86B"/>

  <!-- Network dots (agents / sessions) -->
  <circle cx="150" cy="70" r="3" fill="#0099CC"/>
  <circle cx="166" cy="96" r="3" fill="#6B46C1"/>
  <circle cx="150" cy="122" r="3" fill="#00A86B"/>

  <!-- Connection lines -->
  <path d="M 102 102 L 147 70" stroke="#0099CC" stroke-width="1" opacity="0.6"/>
  <path d="M 102 102 L 163 96" stroke="#6B46C1" stroke-width="1" opacity="0.6"/>
  <path d="M 102 102 L 147 122" stroke="#00A86B" stroke-width="1" opacity="0.6"/>

  <!-- Brand -->
  <text x="240" y="108"
        font-family="JetBrains Mono, Fira Code, system-ui, sans-serif"
        font-size="64"
        font-weight="600"
        fill="#1F2937">
    neocode
  </text>

  <!-- Tagline -->
  <text x="242" y="148"
        font-family="JetBrains Mono, system-ui, sans-serif"
        font-size="18"
        fill="#64748B">
    terminal-native · multi-agent · any model
  </text>

  <!-- Decorative elements -->
  <rect x="240" y="160" width="120" height="2" fill="url(#terminalNeon)" opacity="0.3"/>
  <rect x="240" y="166" width="80" height="2" fill="url(#terminalNeon)" opacity="0.2"/>
</svg>
