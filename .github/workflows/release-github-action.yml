name: release-github-action

on:
  push:
    branches:
      - dev
    paths:
      - "infrastructure/ci/**"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Release
        run: |
          git config --global user.email "neocode@khulnasoft.com"
          git config --global user.name "neocode"
          ./infrastructure/ci/script/release
